plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'java'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

sourceSets.main.java.srcDir("core/src/main/java")

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

def metadata = [
        version: version.toString(),
        minecraft: minecraft_version.toString(),
        loader: loader_version.toString()
]

processResources {
    inputs.properties(metadata)
    filteringCharset = "UTF-8"
    filesMatching("fabric.mod.json") { expand(metadata) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    from("LICENSE") { rename { "LICENSE_homegui" } }
}

publishMods {
    file = remapJar.archiveFile
    changelog = providers.fileContents(layout.projectDirectory.file("CHANGELOG.md")).asText
    type = STABLE
    modLoaders.add("fabric")
    displayName = "HomeGui ${project.version} (Fabric ${minecraft_version})"
    version = project.version

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        projectId = providers.gradleProperty("modrinth_project_id")
        minecraftVersions.add(minecraft_version)
        requires("fabric-api")
    }
}
