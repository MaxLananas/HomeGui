plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'java'
    id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

def minecraftVersion = project.mc_1_21_11
def javaVersion = Integer.parseInt(project.mc_1_21_11_java.toString())
def loaderName = "fabric"

group = project.maven_group
version = "${project.mod_version}-${loaderName}-${minecraftVersion}"
base { archivesName = project.mod_id }

// Loader independent code is compiled into the artifact rather than published as a
// library, so the released JAR is self contained and the core stays testable on its
// own. Nothing here is loader specific: the same source sets feed the NeoForge
// artifact of this generation.
sourceSets.main.java.srcDirs += [
        "${rootDir}/core/src/main/java",
        "${rootDir}/ui/src/main/java",
        "${rootDir}/mc-common/src/main/java",
        "${rootDir}/mc-modern/src/main/java",
        "${rootDir}/glue/fabric-modern/src/main/java",
]
sourceSets.main.resources.srcDirs += [
        "${rootDir}/shared/src/main/resources",
        "${rootDir}/mc-common/src/main/resources",
]

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_1_21_11}"
    // Provided by Minecraft at runtime; declared so the loader independent modules
    // compile without pulling Gson into the artifact.
    compileOnly 'com.google.code.gson:gson:2.11.0'
}

def metadata = [
        mod_version: project.mod_version.toString(),
        minecraft  : minecraftVersion.toString(),
        loader     : project.fabric_loader_version.toString(),
        java       : javaVersion.toString(),
]

processResources {
    inputs.properties(metadata)
    filteringCharset = "UTF-8"
    filesMatching("fabric.mod.json") { expand(metadata) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = javaVersion
}

// No sources or javadoc JAR: the release artifact is the single JAR a player
// installs, and the loader independent code is readable in the repository.
java {
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
    from("${rootDir}/LICENSE") { rename { "LICENSE_homegui" } }
}

// ---------------------------------------------------------------------------
// Porting aid. Minecraft's client API moves between generations, and guessing a
// signature costs a whole CI round trip. This prints the mapped API of the named
// classes, and can list the classes whose name matches a pattern, so a new
// generation is ported against what is actually there.
//
//   ./gradlew :fabric-1.21.11:apiProbe -PprobeClasses=net.minecraft.client.gui.screens.Screen
//   ./gradlew :fabric-1.21.11:apiProbe -PprobeMatch='.*Event\.class'
// ---------------------------------------------------------------------------
tasks.register("apiProbe") {
    description = "Dumps the mapped Minecraft API so a new generation can be ported without guessing."
    // One workflow annotation is the only part of a CI log that can be read back
    // without downloading it, so a whole class has to fit in one.
    def MAX_NOTICE = 60_000
    def wanted = (project.findProperty("probeClasses") ?: "").toString()
            .split(",").collect { it.trim() }.findAll { it }
    def match = (project.findProperty("probeMatch") ?: "").toString()
    // A class like Minecraft is far too big for one annotation, so its dump can be
    // narrowed to the methods actually being ported.
    def filter = (project.findProperty("probeFilter") ?: "").toString()
    def classpath = sourceSets.main.compileClasspath
    inputs.files(classpath)
    doLast {
        def cp = classpath.files.collect { it.absolutePath }.join(File.pathSeparator)

        if (match) {
            def found = new TreeSet<String>()
            classpath.files.findAll { it.name.endsWith(".jar") }.each { jar ->
                def zip = new java.util.zip.ZipFile(jar)
                try {
                    zip.entries().each { entry ->
                        def name = entry.name
                        if (name.endsWith(".class") && name ==~ match) found.add(name)
                    }
                } finally {
                    zip.close()
                }
            }
            def listing = found.join("\n")
            println listing
            println "::notice title=classes matching ${match} (${found.size()})::" +
                    listing.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").take(MAX_NOTICE)
        }

        wanted.each { className ->
            def process = ["javap", "-protected", "-classpath", cp, className].execute()
            process.waitFor()
            def lines = (process.text ?: "").readLines().findAll { it.trim() }
            if (filter) lines = lines.findAll { it ==~ ".*(${filter}).*" }
            def body = lines.join("\n")
            println "===== ${className}\n${body}"
            println "::notice title=${className}::" +
                    body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").take(MAX_NOTICE)
        }
    }
}

// ---------------------------------------------------------------------------
// Publication. The token comes from the environment and is never written into the
// build; without it the task is skipped rather than failing, so a local build does
// not need Modrinth credentials.
// ---------------------------------------------------------------------------
def changelogFor = { String version ->
    def file = rootProject.file("CHANGELOG.md")
    if (!file.exists()) return "HomeGui ${version}"
    def text = file.text
    int start = text.indexOf("## ${version}")
    if (start < 0) return "HomeGui ${version}"
    int end = text.indexOf("\n## ", start + 1)
    return (end < 0 ? text.substring(start) : text.substring(start, end)).trim()
}

publishMods {
    // The remapped JAR is the file a player installs, and the same file the artifact
    // validator has already accepted.
    file = remapJar.archiveFile
    displayName = "HomeGui ${project.mod_version} for Fabric ${minecraftVersion}"
    changelog = changelogFor(project.mod_version.toString())
    type = STABLE
    modLoaders.add(loaderName)

    modrinth {
        projectId = project.modrinth_project_id.toString()
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        minecraftVersions.add(minecraftVersion.toString())
        requires("fabric-api")
    }
}

tasks.named("publishMods").configure {
    onlyIf {
        def present = System.getenv("MODRINTH_API_KEY")?.trim()
        if (!present) logger.lifecycle("MODRINTH_API_KEY is not set; not publishing.")
        return present != null
    }
}
