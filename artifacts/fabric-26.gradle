// Experimental unobfuscated targets. Build each in isolation with -Ptarget=fabric-<version>.
group = project.maven_group
version = "${project.mod_version}-fabric-${minecraftVersion}"
base { archivesName = project.mod_id }

sourceSets.main.java.srcDirs += [
        "${rootDir}/core/src/main/java",
        "${rootDir}/ui/src/main/java",
        "${rootDir}/mc-26/src/main/java",
        "${rootDir}/mc-screen/${screenGeneration}/src/main/java",
        "${rootDir}/glue/${minecraftVersion == "26.3" ? "fabric-26.3" : "fabric-26"}/src/main/java",
]
sourceSets.main.resources.srcDirs += [
        "${rootDir}/shared/src/main/resources",
        "${rootDir}/mc-common/src/main/resources",
        "${rootDir}/artifacts/fabric-1.21.11/src/main/resources",
]
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    compileOnly 'com.google.code.gson:gson:2.11.0'
}
def metadata = [mod_version: project.mod_version.toString(), minecraft: minecraftVersion,
                loader: '0.19.5', java: '25']
processResources {
    inputs.properties(metadata)
    filteringCharset = 'UTF-8'
    filesMatching('fabric.mod.json') { expand(metadata) }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
java {
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
}
jar { from("${rootDir}/LICENSE") { rename { 'LICENSE_homegui' } } }
