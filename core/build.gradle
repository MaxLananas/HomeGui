plugins { id 'java-library' }

group = project.maven_group
version = project.mod_version

repositories { mavenCentral() }

dependencies {
    // Gson ships with every supported Minecraft version, so it is compile only here
    // and on the classpath for tests.
    compileOnly 'com.google.code.gson:gson:2.11.0'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.core_java_version)
    targetCompatibility = JavaVersion.toVersion(project.core_java_version)
}

tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }

test {
    useJUnitPlatform()
    testLogging { events "failed" ; exceptionFormat "full" }
}
