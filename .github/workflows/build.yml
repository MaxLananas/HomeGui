name: Build

on:
  push:
    branches: [main, arena/9e38f821-homegui]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The loader independent modules carry the parsing, validation, storage and
  # interface logic, so their tests run first and on their own: a Minecraft build
  # problem must never hide a core regression.
  core:
    name: Core and interface tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
      - name: Run JUnit tests
        run: |
          set -o pipefail
          ./gradlew :core:check :ui:check --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Test results
        if: always()
        run: ./scripts/report-test-failures.sh
      - name: Report the failure
        if: failure()
        run: ./.github/report-failure.sh build.log
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            ui/build/reports/tests
          if-no-files-found: ignore
          retention-days: 1

  # One job per published artifact, grouped by API generation so that a whole
  # generation can be dropped or added by editing a single matrix entry.
  artifacts:
    name: ${{ matrix.artifact }}
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: fabric-1.21.11
            module: fabric-1.21.11
            java: '21'
          - { artifact: fabric-26.1, module: fabric-26.1, java: '25' }
          - { artifact: fabric-26.1.1, module: fabric-26.1.1, java: '25' }
          - { artifact: fabric-26.1.2, module: fabric-26.1.2, java: '25' }
          - { artifact: fabric-26.2, module: fabric-26.2, java: '25' }
          - { artifact: fabric-26.3, module: fabric-26.3, java: '25' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
      - name: Build
        run: |
          set -o pipefail
          ./gradlew -Ptarget=${{ matrix.module }} :${{ matrix.module }}:build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Validate the artifact
        run: ./scripts/validate-artifacts.sh ${{ matrix.module }}
      - name: Report the failure
        if: failure()
        run: ./.github/report-failure.sh build.log
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 1

  experimental-release:
    name: Publish experimental 26.x jars
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/9e38f821-homegui'
    needs: [core, artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: fabric-26.*
          path: dist
          merge-multiple: true
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for version in 26.1 26.1.1 26.1.2 26.2 26.3; do
            test -f "dist/homegui-4.2.0-fabric-${version}.jar"
          done
          gh release create v4.2.0-beta.1 dist/*.jar --target "$COMMIT" --prerelease --title 'HomeGui 4.2.0 beta — Fabric 26.x' --notes 'Experimental builds for Minecraft 26.1, 26.1.1, 26.1.2, 26.2 and 26.3. Compiled and structurally validated in CI; not tested in Minecraft. Requires Java 25, Fabric Loader 0.19.5 or newer, and the matching Fabric API. Back up your configuration and worlds before testing. Please report crashes with the Minecraft version and full log.'
