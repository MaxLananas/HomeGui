name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew check build --no-daemon --stacktrace 2>&1 | tee build.log
      - run: ./scripts/validate-artifacts.sh
      - uses: actions/upload-artifact@v5
        with:
          name: homegui-${{ github.sha }}
          path: build/libs/homegui-fabric-*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Report failure
        if: failure()
        run: |
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 300 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 3
