name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The loader independent modules carry the parsing, validation, storage and
  # interface logic, so their tests run first and on their own: a Minecraft build
  # problem must never hide a core regression.
  core:
    name: Core and interface tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Run JUnit tests
        run: |
          set -o pipefail
          ./gradlew :core:check :ui:check --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Report the failure
        if: failure()
        run: ./.github/report-failure.sh build.log
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            ui/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7

  # One job per published artifact, grouped by API generation so that a whole
  # generation can be dropped or added by editing a single matrix entry.
  artifacts:
    name: ${{ matrix.artifact }}
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: fabric-1.21.11
            module: fabric-1.21.11
            java: '21'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          set -o pipefail
          ./gradlew :${{ matrix.module }}:build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Validate the artifact
        run: ./scripts/validate-artifacts.sh ${{ matrix.module }}
      - name: Report the failure
        if: failure()
        run: ./.github/report-failure.sh build.log
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
