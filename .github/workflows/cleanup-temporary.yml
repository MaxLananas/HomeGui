name: Clean temporary Actions artifacts
on:
  push:
    branches: [arena/9e38f821-homegui]
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete temporary Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" --jq '.artifacts[].id' > "$RUNNER_TEMP/artifact-ids"
          while read -r id; do
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$id"
          done < "$RUNNER_TEMP/artifact-ids"
