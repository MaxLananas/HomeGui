name: Diagnose Minecraft 26.3 startup
on:
  push:
    branches: [arena/9e38f821-homegui]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libegl-mesa0 mesa-vulkan-drivers
      - run: ./scripts/smoke-client.sh fabric-26.3
