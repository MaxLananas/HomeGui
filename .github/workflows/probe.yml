# Prints the mapped Minecraft API of an artifact module. Minecraft's client API moves
# between generations; this is how a new target is ported against the real signatures
# instead of a guess that only a compiler can disprove.
name: API probe

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Artifact module"
        required: true
        default: "fabric-1.21.11"
      classes:
        description: "Comma separated class names to javap (empty to skip)"
        required: false
        default: ""
      match:
        description: "Regex over jar entry names, e.g. .*Event\\.class (empty to skip)"
        required: false
        default: ""
      java:
        description: "JDK for the module"
        required: true
        default: "21"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java }}
      - uses: gradle/actions/setup-gradle@v5
      - name: Probe
        run: |
          set -o pipefail
          ./gradlew :${{ inputs.module }}:apiProbe \
            -PprobeClasses="${{ inputs.classes }}" -PprobeMatch="${{ inputs.match }}" \
            --no-daemon 2>&1 | tee probe.log
      - name: Report the failure
        if: failure()
        run: ./.github/report-failure.sh probe.log
