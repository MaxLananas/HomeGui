# Publishing writes the changelog once. When the wording in CHANGELOG.md is corrected
# afterwards, this pushes the corrected text to the matching Modrinth version so the
# public page and the repository cannot drift apart.
#
# The pull_request trigger exists so it can run from a branch before it reaches the
# default branch; it is scoped to the files that can change the text.
name: Sync Modrinth changelog

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/sync-modrinth.yml'
      - 'scripts/modrinth-sync-changelog.sh'
      - 'CHANGELOG.md'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Sync
        env:
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
        run: ./scripts/modrinth-sync-changelog.sh
