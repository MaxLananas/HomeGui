name: Release

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Version from gradle.properties (confirmation guard)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5

      - name: Validate release inputs
        env:
          CONFIRMED_VERSION: ${{ inputs.confirm_version }}
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$CONFIRMED_VERSION" = "$VERSION"
          test -n "$MODRINTH_API_KEY"
          test -s CHANGELOG.md
          ! git rev-parse "v$VERSION" >/dev/null 2>&1
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./gradlew clean check build --no-daemon --stacktrace

      - name: Validate artifacts and metadata
        run: ./scripts/validate-artifacts.sh

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(find build/libs -maxdepth 1 -name 'homegui-fabric-*.jar' ! -name '*-sources.jar' -print -quit)
          gh release create "v$VERSION" "$JAR" --draft --verify-tag=false \
            --title "HomeGui $VERSION" --notes-file CHANGELOG.md

      - name: Publish to Modrinth
        env:
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
        run: ./gradlew publishMods --no-daemon --stacktrace

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION" --draft=false --latest
